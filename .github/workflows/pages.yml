name: Deploy fundraiser to GitHub Pages

on:
  push:
    branches: ["main", "updates/security-polish"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run security and reservation regression tests
        run: node --test tests/calendar-core.test.mjs
      - name: Install pinned browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/calendar-tests" --no-save --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/calendar-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test mobile, sign-in, admin access and Ludus flow
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/calendar-tests/node_modules/playwright" node --test tests/calendar-browser.test.mjs
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
